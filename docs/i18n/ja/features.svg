<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 612" role="img" aria-labelledby="featTitle featDesc">
  <title id="featTitle">erikwang2013/hashids 機能設計</title>
  <desc id="featDesc">6つの機能グループ：エンコード/デコード API、マルチ接続管理、マルチフレームワーク適応、コンテナバインディング、設定と公開、フレームワーク非依存カーネル。</desc>

  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "PingFang SC", "Microsoft YaHei", monospace; }
      .bg     { fill: #ffffff; }
      .card   { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .spine  { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
      .t-primary { fill: #0f172a; font-weight: 600; }
      .t-muted   { fill: #475569; }
      .t-dim     { fill: #94a3b8; }
      .t-frontend   { fill: #0891b2; font-weight: 600; }
      .t-backend    { fill: #059669; font-weight: 600; }
      .t-database   { fill: #7c3aed; font-weight: 600; }
      .t-cloud      { fill: #d97706; font-weight: 600; }
      .t-security   { fill: #e11d48; font-weight: 600; }
      .t-messagebus { fill: #ea580c; font-weight: 600; }
      .a-head { fill: #cbd5e1; }

      @media (prefers-color-scheme: dark) {
        .bg    { fill: #0b1220; }
        .card  { fill: #0f172a; stroke: #1e293b; }
        .spine { stroke: #334155; }
        .t-primary { fill: #f8fafc; }
        .t-muted   { fill: #94a3b8; }
        .t-dim     { fill: #64748b; }
        .t-frontend   { fill: #22d3ee; }
        .t-backend    { fill: #34d399; }
        .t-database   { fill: #a78bfa; }
        .t-cloud      { fill: #fbbf24; }
        .t-security   { fill: #fb7185; }
        .t-messagebus { fill: #fb923c; }
        .a-head { fill: #334155; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="a-head"/>
    </marker>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="612"/>

  <text x="24" y="40" class="t-primary" font-size="20">機能設計 · Feature Design</text>
  <text x="24" y="62" class="t-muted" font-size="11">6つの機能グループ：カーネルはフレームワークなしで単独利用でき、適応層はカーネルを各フレームワークのコンテナと設定体系へ接続するだけ</text>

  <!-- hub spine + spokes -->
  <path class="spine" d="M540 164 V516"/>
  <path class="spine" d="M540 256 H460" marker-end="url(#ah)"/>
  <path class="spine" d="M540 386 H460" marker-end="url(#ah)"/>
  <path class="spine" d="M540 516 H460" marker-end="url(#ah)"/>
  <path class="spine" d="M540 256 H620" marker-end="url(#ah)"/>
  <path class="spine" d="M540 386 H620" marker-end="url(#ah)"/>
  <path class="spine" d="M540 516 H620" marker-end="url(#ah)"/>

  <!-- hub -->
  <rect x="440" y="88" width="200" height="76" rx="14" fill="url(#rootGrad)"/>
  <text x="540" y="120" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">erikwang2013/hashids</text>
  <text x="540" y="142" font-size="9" fill="rgba(15,23,42,.72)" text-anchor="middle">PHP マルチフレームワーク統合パッケージ</text>

  <!-- left column -->
  <rect class="card" x="60" y="200" width="400" height="112" rx="12"/>
  <text class="t-frontend" x="82" y="233" font-size="13">エンコード/デコード API</text>
  <text class="t-muted" x="82" y="260" font-size="10">encode() / decode() / encodeHex() / decodeHex()</text>
  <text class="t-muted" x="82" y="282" font-size="10">HashidsManager::__call() 経由でデフォルト接続へ転送</text>
  <text class="t-dim"   x="82" y="302" font-size="10">接続未指定なら connection() は不要</text>

  <rect class="card" x="60" y="330" width="400" height="112" rx="12"/>
  <text class="t-database" x="82" y="363" font-size="13">マルチフレームワーク適応</text>
  <text class="t-muted" x="82" y="390" font-size="10">Laravel / Webman / ThinkPHP / Hyperf の4統合</text>
  <text class="t-muted" x="82" y="412" font-size="10">Laravel = ServiceProvider · Webman = Bootstrap</text>
  <text class="t-dim"   x="82" y="432" font-size="10">ThinkPHP = Service · Hyperf = ConfigProvider</text>

  <rect class="card" x="60" y="460" width="400" height="112" rx="12"/>
  <text class="t-security" x="82" y="493" font-size="13">設定と公開</text>
  <text class="t-muted" x="82" y="520" font-size="10">フラット構造：4 フレームワークで一致</text>
  <text class="t-muted" x="82" y="542" font-size="10">パス：config/hashids.php または autoload/</text>
  <text class="t-dim"   x="82" y="562" font-size="10">vendor:publish · Install コピー · publish</text>

  <!-- right column -->
  <rect class="card" x="620" y="200" width="400" height="112" rx="12"/>
  <text class="t-backend" x="642" y="233" font-size="13">マルチ接続管理</text>
  <text class="t-muted" x="642" y="260" font-size="10">connection('alternative') で名前付き接続を切替</text>
  <text class="t-muted" x="642" y="282" font-size="10">遅延構築 + インスタンスキャッシュ、同一接続は1回だけ構築</text>
  <text class="t-dim"   x="642" y="302" font-size="10">default 欠落・不正時は 'main' にフォールバック</text>

  <rect class="card" x="620" y="330" width="400" height="112" rx="12"/>
  <text class="t-cloud" x="642" y="363" font-size="13">コンテナバインディング</text>
  <text class="t-muted" x="642" y="390" font-size="10">クラス名バインディング + 'hashids' などの文字列キー</text>
  <text class="t-muted" x="642" y="412" font-size="10">Hashids\Hashids（デフォルト接続のインスタンス）</text>
  <text class="t-dim"   x="642" y="432" font-size="10">コンストラクタ注入とコンテナ get() に対応</text>

  <rect class="card" x="620" y="460" width="400" height="112" rx="12"/>
  <text class="t-messagebus" x="642" y="493" font-size="13">フレームワーク非依存カーネル</text>
  <text class="t-muted" x="642" y="520" font-size="10">new HashidsManager($config, $factory) だけで動作</text>
  <text class="t-muted" x="642" y="542" font-size="10">設定は HashidsManager 内で正規化、引数は mixed を許容</text>
  <text class="t-dim"   x="642" y="562" font-size="10">カーネルはフレームワークのパッケージを require しない</text>
</svg>
