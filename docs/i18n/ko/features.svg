<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 612" role="img" aria-labelledby="featTitle featDesc">
  <title id="featTitle">erikwang2013/hashids 기능 설계</title>
  <desc id="featDesc">여섯 가지 기능 그룹: 인코딩/디코딩 API, 다중 연결 관리, 다중 프레임워크 어댑터, 컨테이너 바인딩, 설정과 배포, 프레임워크 비의존 커널.</desc>

  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "PingFang SC", "Microsoft YaHei", monospace; }
      .bg     { fill: #ffffff; }
      .card   { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .spine  { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
      .t-primary { fill: #0f172a; font-weight: 600; }
      .t-muted   { fill: #475569; }
      .t-dim     { fill: #94a3b8; }
      .t-frontend   { fill: #0891b2; font-weight: 600; }
      .t-backend    { fill: #059669; font-weight: 600; }
      .t-database   { fill: #7c3aed; font-weight: 600; }
      .t-cloud      { fill: #d97706; font-weight: 600; }
      .t-security   { fill: #e11d48; font-weight: 600; }
      .t-messagebus { fill: #ea580c; font-weight: 600; }
      .a-head { fill: #cbd5e1; }

      @media (prefers-color-scheme: dark) {
        .bg    { fill: #0b1220; }
        .card  { fill: #0f172a; stroke: #1e293b; }
        .spine { stroke: #334155; }
        .t-primary { fill: #f8fafc; }
        .t-muted   { fill: #94a3b8; }
        .t-dim     { fill: #64748b; }
        .t-frontend   { fill: #22d3ee; }
        .t-backend    { fill: #34d399; }
        .t-database   { fill: #a78bfa; }
        .t-cloud      { fill: #fbbf24; }
        .t-security   { fill: #fb7185; }
        .t-messagebus { fill: #fb923c; }
        .a-head { fill: #334155; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="a-head"/>
    </marker>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="612"/>

  <text x="24" y="40" class="t-primary" font-size="20">기능 설계 · Feature Design</text>
  <text x="24" y="62" class="t-muted" font-size="11">여섯 가지 기능 그룹: 커널은 프레임워크 없이 독립 동작, 어댑터 계층은 커널을 각 프레임워크 컨테이너에 연결</text>

  <!-- hub spine + spokes -->
  <path class="spine" d="M540 164 V516"/>
  <path class="spine" d="M540 256 H460" marker-end="url(#ah)"/>
  <path class="spine" d="M540 386 H460" marker-end="url(#ah)"/>
  <path class="spine" d="M540 516 H460" marker-end="url(#ah)"/>
  <path class="spine" d="M540 256 H620" marker-end="url(#ah)"/>
  <path class="spine" d="M540 386 H620" marker-end="url(#ah)"/>
  <path class="spine" d="M540 516 H620" marker-end="url(#ah)"/>

  <!-- hub -->
  <rect x="440" y="88" width="200" height="76" rx="14" fill="url(#rootGrad)"/>
  <text x="540" y="120" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">erikwang2013/hashids</text>
  <text x="540" y="142" font-size="9" fill="rgba(15,23,42,.72)" text-anchor="middle">PHP 다중 프레임워크 통합 패키지</text>

  <!-- left column -->
  <rect class="card" x="60" y="200" width="400" height="112" rx="12"/>
  <text class="t-frontend" x="82" y="233" font-size="13">인코딩/디코딩 API</text>
  <text class="t-muted" x="82" y="260" font-size="10">encode() / decode() / encodeHex() / decodeHex()</text>
  <text class="t-muted" x="82" y="282" font-size="10">HashidsManager::__call() 을 거쳐 기본 연결로 전달</text>
  <text class="t-dim"   x="82" y="302" font-size="10">연결 미지정 시 connection() 명시 불필요</text>

  <rect class="card" x="60" y="330" width="400" height="112" rx="12"/>
  <text class="t-database" x="82" y="363" font-size="13">다중 프레임워크 어댑터</text>
  <text class="t-muted" x="82" y="390" font-size="10">Laravel / Webman / ThinkPHP / Hyperf 4종 통합</text>
  <text class="t-muted" x="82" y="412" font-size="10">Laravel = ServiceProvider · Webman = Bootstrap</text>
  <text class="t-dim"   x="82" y="432" font-size="10">ThinkPHP = Service · Hyperf = ConfigProvider</text>

  <rect class="card" x="60" y="460" width="400" height="112" rx="12"/>
  <text class="t-security" x="82" y="493" font-size="13">설정과 배포</text>
  <text class="t-muted" x="82" y="520" font-size="10">평면 구조: 네 프레임워크 동일</text>
  <text class="t-muted" x="82" y="542" font-size="10">경로: config/hashids.php 또는 autoload/</text>
  <text class="t-dim"   x="82" y="562" font-size="10">vendor:publish · Install 복사 · publish</text>

  <!-- right column -->
  <rect class="card" x="620" y="200" width="400" height="112" rx="12"/>
  <text class="t-backend" x="642" y="233" font-size="13">다중 연결 관리</text>
  <text class="t-muted" x="642" y="260" font-size="10">connection('alternative') 로 명명 연결 전환</text>
  <text class="t-muted" x="642" y="282" font-size="10">지연 생성 + 인스턴스 캐시, 같은 연결은 한 번만 생성</text>
  <text class="t-dim"   x="642" y="302" font-size="10">default 가 없거나 잘못되면 'main' 으로 폴백</text>

  <rect class="card" x="620" y="330" width="400" height="112" rx="12"/>
  <text class="t-cloud" x="642" y="363" font-size="13">컨테이너 바인딩</text>
  <text class="t-muted" x="642" y="390" font-size="10">클래스 이름 바인딩 + 'hashids' 등 문자열 키</text>
  <text class="t-muted" x="642" y="412" font-size="10">Hashids\Hashids(기본 연결 인스턴스)</text>
  <text class="t-dim"   x="642" y="432" font-size="10">생성자 주입과 컨테이너 get() 지원</text>

  <rect class="card" x="620" y="460" width="400" height="112" rx="12"/>
  <text class="t-messagebus" x="642" y="493" font-size="13">프레임워크 비의존 커널</text>
  <text class="t-muted" x="642" y="520" font-size="10">new HashidsManager($config, $factory) 만으로 동작</text>
  <text class="t-muted" x="642" y="542" font-size="10">설정은 HashidsManager 안에서 정규화, mixed 입력 허용</text>
  <text class="t-dim"   x="642" y="562" font-size="10">커널은 어떤 프레임워크 패키지도 require 하지 않음</text>
</svg>
