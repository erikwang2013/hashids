<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 704" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">erikwang2013/hashids 아키텍처 설계</title>
  <desc id="archDesc">4계층 단방향 의존: 애플리케이션 호출 계층, 프레임워크 어댑터 계층, 프레임워크 비의존 코어 계층, 하위 hashids/hashids 의존성. 코어 계층은 HashidsManager 와 HashidsFactory 로 구성됩니다.</desc>

  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "PingFang SC", "Microsoft YaHei", monospace; }
      .bg          { fill: #ffffff; }
      .lane        { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .lane-title  { fill: #94a3b8; font-size: 10px; letter-spacing: 1.2px; }
      .c-mask      { fill: #ffffff; }
      .c-frontend  { fill: rgba(34,211,238,.15);  stroke: #0891b2; stroke-width: 1.5; }
      .c-backend   { fill: rgba(52,211,153,.18);  stroke: #059669; stroke-width: 1.5; }
      .c-cloud     { fill: rgba(251,191,36,.18);  stroke: #d97706; stroke-width: 1.5; }
      .c-database  { fill: rgba(167,139,250,.18); stroke: #7c3aed; stroke-width: 1.5; }
      .t-primary   { fill: #0f172a; font-weight: 600; }
      .t-muted     { fill: #475569; }
      .t-dim       { fill: #94a3b8; }
      .a-default   { stroke: #94a3b8; fill: none; }
      .a-emphasis  { stroke: #059669; fill: none; }
      .a-head-default  { fill: #94a3b8; }
      .a-head-emphasis { fill: #059669; }

      @media (prefers-color-scheme: dark) {
        .bg          { fill: #0b1220; }
        .lane        { fill: #0f172a; stroke: #1e293b; }
        .lane-title  { fill: #64748b; }
        .c-mask      { fill: #0f172a; }
        .c-frontend  { fill: rgba(8,51,68,.40);   stroke: #22d3ee; }
        .c-backend   { fill: rgba(6,78,59,.40);   stroke: #34d399; }
        .c-cloud     { fill: rgba(120,53,15,.35); stroke: #fbbf24; }
        .c-database  { fill: rgba(76,29,149,.40); stroke: #a78bfa; }
        .t-primary   { fill: #f8fafc; }
        .t-muted     { fill: #94a3b8; }
        .t-dim       { fill: #64748b; }
        .a-default   { stroke: #64748b; }
        .a-emphasis  { stroke: #34d399; }
        .a-head-default  { fill: #64748b; }
        .a-head-emphasis { fill: #34d399; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="a-head-default"/>
    </marker>
    <marker id="ah-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="a-head-emphasis"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="704"/>

  <text x="24" y="40" class="t-primary" font-size="20">erikwang2013/hashids 아키텍처 설계</text>
  <text x="24" y="62" class="t-muted" font-size="11">4계층 단방향 의존: 애플리케이션 호출 → 프레임워크 어댑터 → 비의존 커널 → 하위 의존성</text>

  <!-- layer lanes -->
  <rect class="lane" x="20" y="80"  width="1040" height="104" rx="10"/>
  <rect class="lane" x="20" y="224" width="1040" height="132" rx="10"/>
  <rect class="lane" x="20" y="396" width="1040" height="148" rx="10"/>
  <rect class="lane" x="20" y="584" width="1040" height="100" rx="10"/>

  <text class="lane-title" x="36" y="100">애플리케이션 호출 계층 · APPLICATION</text>
  <text class="lane-title" x="36" y="244">프레임워크 어댑터 계층 · ADAPTERS (src/&lt;Framework&gt;/)</text>
  <text class="lane-title" x="36" y="416">코어 계층 · CORE(프레임워크 비의존, 제로 의존)</text>
  <text class="lane-title" x="36" y="604">하위 의존성 · DEPENDENCY</text>

  <!-- arrows (drawn before nodes so boxes paint over them) -->
  <line class="a-emphasis" x1="540" y1="184" x2="540" y2="220" stroke-width="2" marker-end="url(#ah-e)"/>
  <line class="a-emphasis" x1="540" y1="356" x2="540" y2="392" stroke-width="2" marker-end="url(#ah-e)"/>
  <line class="a-emphasis" x1="540" y1="544" x2="540" y2="580" stroke-width="2" marker-end="url(#ah-e)"/>
  <line class="a-default"  x1="260" y1="484" x2="326" y2="484" stroke-width="1.5" marker-end="url(#ah)"/>
  <line class="a-default"  x1="710" y1="484" x2="776" y2="484" stroke-width="1.5" marker-end="url(#ah)"/>
  <text class="t-dim" x="745" y="476" font-size="9" text-anchor="middle">make()</text>

  <!-- L1 애플리케이션 호출 계층 -->
  <rect class="c-mask"     x="60"  y="118" width="260" height="56" rx="10"/>
  <rect class="c-frontend" x="60"  y="118" width="260" height="56" rx="10"/>
  <text class="t-primary" x="190" y="142" font-size="12" text-anchor="middle">Hashids::encode(1, 2, 3)</text>
  <text class="t-muted"   x="190" y="162" font-size="9"  text-anchor="middle">파사드 Facade(Laravel)</text>

  <rect class="c-mask"     x="410" y="118" width="260" height="56" rx="10"/>
  <rect class="c-frontend" x="410" y="118" width="260" height="56" rx="10"/>
  <text class="t-primary" x="540" y="142" font-size="12" text-anchor="middle">app('hashids')</text>
  <text class="t-muted"   x="540" y="162" font-size="9"  text-anchor="middle">컨테이너 / 헬퍼 함수(ThinkPHP 등)</text>

  <rect class="c-mask"     x="760" y="118" width="260" height="56" rx="10"/>
  <rect class="c-frontend" x="760" y="118" width="260" height="56" rx="10"/>
  <text class="t-primary" x="890" y="142" font-size="12" text-anchor="middle">__construct(HashidsManager $m)</text>
  <text class="t-muted"   x="890" y="162" font-size="9"  text-anchor="middle">생성자 주입(네 프레임워크 공통)</text>

  <!-- L2 프레임워크 어댑터 계층 -->
  <rect class="c-mask"    x="60"  y="262" width="216" height="84" rx="10"/>
  <rect class="c-backend" x="60"  y="262" width="216" height="84" rx="10"/>
  <text class="t-primary" x="168" y="294" font-size="12" text-anchor="middle">Laravel</text>
  <text class="t-muted"   x="168" y="316" font-size="9"  text-anchor="middle">HashidsServiceProvider</text>
  <text class="t-dim"     x="168" y="338" font-size="8"  text-anchor="middle">singleton · alias · publish</text>

  <rect class="c-mask"    x="308" y="262" width="216" height="84" rx="10"/>
  <rect class="c-backend" x="308" y="262" width="216" height="84" rx="10"/>
  <text class="t-primary" x="416" y="294" font-size="12" text-anchor="middle">Webman</text>
  <text class="t-muted"   x="416" y="316" font-size="9"  text-anchor="middle">Install + Bootstrap</text>
  <text class="t-dim"     x="416" y="338" font-size="8"  text-anchor="middle">설치 복사 · 컨테이너 등록</text>

  <rect class="c-mask"    x="556" y="262" width="216" height="84" rx="10"/>
  <rect class="c-backend" x="556" y="262" width="216" height="84" rx="10"/>
  <text class="t-primary" x="664" y="294" font-size="12" text-anchor="middle">ThinkPHP</text>
  <text class="t-muted"   x="664" y="316" font-size="9"  text-anchor="middle">HashidsService</text>
  <text class="t-dim"     x="664" y="338" font-size="8"  text-anchor="middle">think\Service 등록 바인딩</text>

  <rect class="c-mask"    x="804" y="262" width="216" height="84" rx="10"/>
  <rect class="c-backend" x="804" y="262" width="216" height="84" rx="10"/>
  <text class="t-primary" x="912" y="294" font-size="12" text-anchor="middle">Hyperf</text>
  <text class="t-muted"   x="912" y="316" font-size="9"  text-anchor="middle">ConfigProvider</text>
  <text class="t-dim"     x="912" y="338" font-size="8"  text-anchor="middle">의존성 매핑 · publish</text>

  <!-- L3 코어 계층 -->
  <rect class="c-mask"  x="60"  y="434" width="200" height="100" rx="10"/>
  <rect class="c-cloud" x="60"  y="434" width="200" height="100" rx="10"/>
  <text class="t-primary" x="160" y="470" font-size="12" text-anchor="middle">설정 소스</text>
  <text class="t-muted"   x="160" y="494" font-size="9"  text-anchor="middle">config/hashids.php</text>
  <text class="t-dim"     x="160" y="514" font-size="9"  text-anchor="middle">(Hyperf 는 hashids 키)</text>

  <rect class="c-mask"    x="330" y="434" width="380" height="100" rx="10"/>
  <rect class="c-backend" x="330" y="434" width="380" height="100" rx="10"/>
  <text class="t-primary" x="350" y="464" font-size="14">HashidsManager</text>
  <text class="t-muted"   x="350" y="488" font-size="9">connection($name) · 지연 생성 + $connections 캐시</text>
  <text class="t-muted"   x="350" y="507" font-size="9">__call() · 연결 미지정 시 기본 연결로 전달</text>
  <text class="t-muted"   x="350" y="526" font-size="9">getDefaultConnection() · 없거나 잘못되면 'main' 으로 폴백</text>

  <rect class="c-mask"    x="780" y="434" width="240" height="100" rx="10"/>
  <rect class="c-backend" x="780" y="434" width="240" height="100" rx="10"/>
  <text class="t-primary" x="900" y="470" font-size="12" text-anchor="middle">HashidsFactory</text>
  <text class="t-muted"   x="900" y="494" font-size="9"  text-anchor="middle">make(array $conn)</text>
  <text class="t-dim"     x="900" y="514" font-size="9"  text-anchor="middle">salt / length / alphabet</text>

  <!-- L4 하위 의존성 -->
  <rect class="c-mask"     x="380" y="620" width="320" height="52" rx="10"/>
  <rect class="c-database" x="380" y="620" width="320" height="52" rx="10"/>
  <text class="t-primary" x="540" y="644" font-size="12" text-anchor="middle">hashids/hashids ^4.1 || ^5.0</text>
  <text class="t-muted"   x="540" y="664" font-size="9"  text-anchor="middle">하위 인코딩/디코딩 구현</text>
</svg>
