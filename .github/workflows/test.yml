name: Tests

# PHP 版本兼容矩阵 —— 让 composer.json 里的兼容声明变成实证。
#
# 覆盖 `"php": "^8.0"` 的全部 8.x，以及 `hashids/hashids ^4.1 || ^5.0` 的两条分支：
#
#   * 矩阵作业：各 PHP 版本各自解析依赖（仓库不提交 composer.lock，见 .gitignore）。
#     顺带覆盖 phpunit 9 / 10 / 11 三个大版本 —— 8.0 上只能装到 9.6，8.2+ 会装 11.x。
#   * lowest 作业：PHP 8.0 + `--prefer-lowest`，显式把 hashids 钉到 4.1。
#     这一条不能靠矩阵顺带覆盖：8.0 上装到 4.x 只是因为 hashids 5.x 的 `php: ^8.1`
#     把它挡住了，哪天 5.x 放宽了 PHP 要求，4.x 分支就会**静默失去覆盖**。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Show resolved versions
        run: composer show --direct

      - name: Run tests
        run: vendor/bin/phpunit

  # Laravel 契约测试单独一个作业 —— 它**不能**与上面那个合并。
  #
  # Laravel 与 Webman 都定义全局函数 base_path()（前者在
  # Illuminate\Foundation\helpers.php，后者在 support/helpers.php），谁生效取决于
  # composer files-autoload 的顺序。装进同一个 vendor 时 Laravel 那份会赢，
  # 于是 Webman 侧的 Install 调用 base_path() 会落到 Laravel 的实现上，而它需要
  # 启动过的 Laravel 应用 —— 直接 Fatal error:
  #   Call to undefined method Illuminate\Container\Container::basePath()
  #
  # 这条冲突是实测出来的（本地把 laravel/framework 与 webman-framework 装进同一
  # vendor 后，Webman 与 Install 的契约测试全数报这个错）。真实项目不会同时装
  # 两者，所以不需要改产品代码，但 CI 必须把两个环境分开。
  contract-laravel:
    name: Laravel contract (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Laravel test harness
        run: >
          composer require --dev --no-interaction --with-all-dependencies
          orchestra/testbench:^9.0

      - name: Show resolved versions
        run: composer show --direct

      - name: Run Laravel contract tests
        run: vendor/bin/phpunit --configuration phpunit.contract-laravel.xml

  # 契约测试：把四个适配器放到**真实框架**面前跑，而不是手写替身。
  #
  # 为什么单独一个作业：真框架包装不进 require-dev —— workerman/webman-framework 要求
  # PHP >= 8.1、hyperf/* 要求 >= 8.2，而本包声明 `php: ^8.0`。写进去会让 8.0 的作业
  # 直接解析失败。所以只在 8.2 上按需安装并跑 tests/Contract。
  #
  # 这一层要守住的问题类型：Hyperf 的配置多包一层导致整个集成不可用，是「适配器约定
  # 从未对着真框架验过」的典型 —— 当时的测试全用手写替身，替身按同一个错误假设写的，
  # 所以永远是绿的。
  contract:
    name: Real-framework contract (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # Hyperf 的 DI 容器解析依赖协程上下文（hyperf/context → hyperf/engine），
          # 没有 Swoole/Swow 时 Container::get() 会以 Class "Swoole\Coroutine" not found
          # 失败。这不是本包的问题 —— 真实 Hyperf 部署必然带 Swoole 或 Swow ——
          # 但 runner 默认两者都没有，所以要显式装上，否则 Hyperf 那几条契约测试
          # 在 CI 上必然红（本地开发机往往已经装了，容易误判成"通过"）。
          extensions: swoole
          coverage: none
          tools: composer:v2

      - name: Install package dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Install real frameworks
        run: >
          composer require --dev --no-interaction --with-all-dependencies
          topthink/framework:^8.0
          workerman/webman-framework:^2.0
          hyperf/contract:^3.0
          hyperf/config:^3.0
          hyperf/di:^3.0

      - name: Show resolved versions
        run: composer show --direct

      - name: Run contract tests
        run: vendor/bin/phpunit --configuration phpunit.contract.xml

  lowest:
    name: PHP 8.0 + lowest deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer:v2

      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction

      - name: Show resolved versions
        run: composer show --direct

      - name: Run tests
        run: vendor/bin/phpunit
